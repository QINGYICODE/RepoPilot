server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: repopilot
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/repopilot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:repopilot}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
      connection-init-sql: "SET time_zone = '+00:00'"
  flyway:
    enabled: true
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    chat:
      client:
        enabled: false
management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
repopilot:
  allow-manual-repository-authorization: ${ALLOW_MANUAL_REPOSITORY_AUTHORIZATION:true}
  storage-directory: ${REPOSITORY_STORAGE_DIR:.local/repositories}
  allowed-repositories: ${REPOSITORY_ALLOWLIST:spring-petclinic/spring-petclinic-microservices}
  github-token: ${GITHUB_TOKEN:}
  network-proxy: ${REPOSITORY_PROXY:}
  max-files: 5000
  max-file-bytes: 262144
  max-history-commits: 2000
  max-evidence: 40000
  job-lease-seconds: 180
